name: array-oriented-programming

channels:
  - conda-forge

dependencies:
  # Python itself
  - python=3.13

  # JupyterLab interface
  - jupyterlab
  - ipympl
  - ipywidgets
  - nbconvert

  # core scientific Python libraries
  - numpy
  - pandas
  - matplotlib
  - scipy
  - scikit-learn
  - h5py
  - pyarrow
  - pympler
  - requests
  - aiohttp
  - fsspec
  - pint

  # libraries for particle physics
  - uproot
  - awkward
  - vector
  - hist
  - hepunits
  - particle

  # compilers
  - cxx-compiler
  - pybind11
  - numba
  - jax

  # distributed computing
  - dask
  - distributed
  - dask-awkward
  - graphviz
  - python-graphviz
